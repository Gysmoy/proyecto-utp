<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                template="/WEB-INF/templates/auth.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{loginBean.alEntrar}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="titulo">Iniciar sesión</ui:define>

    <ui:define name="contenido">
        <div class="auth-titulo">
            <i class="pi pi-shield auth-icon"></i>
            <h1>Acceso al Sistema</h1>
            <p>Gestor de contraseñas y accesos</p>
        </div>

        <h:form id="frmLogin">
            <p:focus context="frmLogin"/>
            <p:messages id="mensajes" closable="true"/>

            <div class="campo">
                <p:outputLabel for="usuario" value="Usuario o correo" indicateRequired="false"/>
                <p:inputText id="usuario" value="#{loginBean.usuario}" required="true"
                             requiredMessage="Ingresa tu usuario o correo." autocomplete="username"/>
            </div>
            <div class="campo">
                <p:outputLabel for="password" value="Contraseña" indicateRequired="false"/>
                <p:password id="password" value="#{loginBean.password}" required="true"
                            requiredMessage="Ingresa tu contraseña." autocomplete="current-password"/>
            </div>

            <p:commandButton id="ingresar" value="Ingresar" icon="pi pi-sign-in" action="#{loginBean.ingresar}"
                             ajax="false" styleClass="boton-ancho"/>
        </h:form>

        <p class="auth-pie">¿No tienes cuenta? <h:link outcome="/registro" value="Regístrate"/></p>
    </ui:define>
</ui:composition>
