<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="es"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <!-- Raiz de la aplicacion y token CSRF de la sesion para las llamadas AJAX a /api -->
        <meta name="ctx" content="#{request.contextPath}"/>
        <meta name="csrf-token" content="#{sesionBean.csrf}"/>
        <title><ui:insert name="titulo"/> - Gestor de Accesos</title>
        <h:outputScript name="js/api.js"/>
        <f:facet name="last">
            <h:outputStylesheet name="css/app.css"/>
        </f:facet>
    </h:head>
    <h:body>
        <header class="barra">
            <h:link outcome="/accesos" styleClass="marca">
                <i class="pi pi-shield"></i> Gestor de Accesos
            </h:link>
            <h:form id="frmSesion" styleClass="barra-usuario" onsubmit="return false;">
                <span class="barra-nombre"><i class="pi pi-user"></i> #{sesionBean.usuario.nombre}</span>
                <p:commandButton id="btnSalir" type="button" value="Salir" icon="pi pi-sign-out" onclick="salir()"
                                 styleClass="ui-button-outlined boton-claro"/>
            </h:form>
        </header>

        <main class="contenedor">
            <ui:insert name="contenido"/>
        </main>

        <p:growl id="avisos" widgetVar="avisos" globalOnly="true" life="3000"/>
    </h:body>
</html>
