<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                template="/WEB-INF/templates/app.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">Mis accesos</ui:define>

    <!-- Faces arma la vista con PrimeFaces; los datos viajan por AJAX en JSON
         contra la API REST /api/accesos (ver resources/js/accesos.js) -->
    <ui:define name="contenido">
        <h:form id="frmLista" onsubmit="return false;">
            <div class="cabecera">
                <div>
                    <h1>Mis accesos</h1>
                    <small class="ayuda" id="contador">Cargando...</small>
                </div>
                <p:commandButton id="btnNuevo" type="button" value="Nuevo acceso" icon="pi pi-plus"
                                 onclick="nuevoAcceso()"/>
            </div>

            <div class="filtros">
                <p:inputText id="q" placeholder="Buscar por título, usuario o URL" autocomplete="off"/>
                <p:selectOneMenu id="tipoFiltro" widgetVar="selFiltro" onchange="filtrar()">
                    <f:selectItem itemLabel="Todos los tipos" itemValue="" noSelectionOption="true"/>
                    <f:selectItems value="#{tipoBean.tipos}" var="t" itemLabel="#{t.nombre}" itemValue="#{t.id}"/>
                </p:selectOneMenu>
                <p:commandButton id="btnLimpiar" type="button" value="Limpiar" icon="pi pi-times"
                                 onclick="limpiarFiltros()" styleClass="ui-button-flat ui-button-secondary"/>
            </div>
        </h:form>

        <!-- Tabla con las clases de p:dataTable: las filas las pinta accesos.js con el JSON de GET /api/accesos -->
        <div id="tabla" class="ui-datatable ui-widget ui-datatable-reflow">
            <div class="ui-datatable-tablewrapper">
                <table role="grid">
                    <thead>
                        <tr role="row">
                            <th class="ui-state-default" role="columnheader" scope="col"><span class="ui-column-title">Acceso</span></th>
                            <th class="ui-state-default" role="columnheader" scope="col" style="width: 10rem"><span class="ui-column-title">Tipo</span></th>
                            <th class="ui-state-default" role="columnheader" scope="col" style="width: 18rem"><span class="ui-column-title">Usuario</span></th>
                            <th class="ui-state-default" role="columnheader" scope="col" style="width: 18rem"><span class="ui-column-title">Contraseña</span></th>
                            <th class="ui-state-default" role="columnheader" scope="col" style="width: 7rem"><span class="ui-column-title">Acciones</span></th>
                        </tr>
                    </thead>
                    <tbody id="filas" class="ui-datatable-data ui-widget-content">
                        <tr class="ui-widget-content ui-datatable-empty-message"><td colspan="5">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="paginador"></div>
        </div>

        <p:dialog id="dlgAcceso" widgetVar="dlgAcceso" modal="true" resizable="false" responsive="true" width="640"
                  header="Nuevo acceso">
            <h:form id="frmAcceso" autocomplete="off" onsubmit="return false;">
                <p:messages id="erroresForm" closable="false"/>

                <div class="form-grid">
                    <div class="campo col-2">
                        <p:outputLabel for="titulo" value="Título"/>
                        <p:inputText id="titulo" required="true" maxlength="100" placeholder="Ej: Gmail personal"/>
                    </div>
                    <div class="campo">
                        <p:outputLabel for="tipo" value="Tipo"/>
                        <p:selectOneMenu id="tipo" widgetVar="selTipo" required="true">
                            <f:selectItem itemLabel="Selecciona..." itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{tipoBean.tipos}" var="t" itemLabel="#{t.nombre}" itemValue="#{t.id}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="campo col-3">
                        <p:outputLabel for="url" value="URL (opcional)"/>
                        <p:inputText id="url" maxlength="255" placeholder="https://..."/>
                    </div>
                    <div class="campo col-15">
                        <p:outputLabel for="login" value="Usuario / correo de la cuenta"/>
                        <p:inputText id="login" required="true" maxlength="150"/>
                    </div>
                    <div class="campo col-15">
                        <p:outputLabel for="clave" value="Contraseña"/>
                        <div class="ui-inputgroup">
                            <p:password id="clave" autocomplete="new-password"/>
                            <p:commandButton id="verClave" type="button" icon="pi pi-eye" title="Mostrar"
                                             onclick="alternarClave()" styleClass="ui-button-secondary"/>
                            <p:commandButton id="generarClave" type="button" icon="pi pi-bolt" title="Generar contraseña segura"
                                             onclick="generarClave()" styleClass="ui-button-secondary"/>
                        </div>
                        <small class="ayuda">Se guarda cifrada con tu llave pública RSA.</small>
                    </div>
                    <div class="campo col-3">
                        <p:outputLabel for="notas" value="Notas (opcional)"/>
                        <p:inputTextarea id="notas" rows="3" maxlength="2000" autoResize="false"/>
                    </div>
                </div>

                <div class="dialogo-botones">
                    <p:commandButton value="Cancelar" type="button" onclick="PF('dlgAcceso').hide()"
                                     styleClass="ui-button-flat ui-button-secondary"/>
                    <p:commandButton id="btnGuardar" type="button" value="Guardar" icon="pi pi-save"
                                     onclick="guardarAcceso()"/>
                </div>
                <p:defaultCommand target="btnGuardar"/>
            </h:form>
        </p:dialog>

        <p:confirmDialog id="dlgEliminar" widgetVar="dlgEliminar" header="Eliminar acceso" message="¿Seguro?"
                         icon="pi pi-exclamation-triangle" showEffect="fade" hideEffect="fade" responsive="true" width="380">
            <p:commandButton value="Cancelar" type="button" onclick="PF('dlgEliminar').hide()" styleClass="ui-button-flat"/>
            <p:commandButton id="btnConfirmarEliminar" value="Eliminar" type="button" onclick="confirmarEliminar()"
                             styleClass="ui-button-danger"/>
        </p:confirmDialog>

        <h:outputScript name="js/accesos.js"/>
    </ui:define>
</ui:composition>
